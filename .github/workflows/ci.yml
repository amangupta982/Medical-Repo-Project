name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: brics_dev_pw
          POSTGRES_DB: brics_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: './backend/requirements.txt'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:brics_dev_pw@localhost:5432/brics_health
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: brics_dev_pw
        POSTGRES_DB: brics_health
        POSTGRES_SERVER: localhost
        SECRET_KEY: test_secret_key_for_ci_pipeline_only
        ENVIRONMENT: test
      run: |
        pytest tests/

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm install

    - name: Run Tests
      working-directory: ./frontend
      run: npm run test

    - name: Build
      working-directory: ./frontend
      run: npm run build
